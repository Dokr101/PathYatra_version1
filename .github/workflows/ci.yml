name: CI

# Typecheck, build, test and dependency audit on every push and pull request to
# main. Third-party actions are pinned to commit SHAs (release in the trailing
# comment) so a moved tag cannot execute unreviewed code in this repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0; latest 20.x satisfies it.
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend and backend source
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Test backend
        run: npm test
        working-directory: backend
        env:
          # CI has no backend/.env; these satisfy the boot-time guards in
          # src/lib/env.ts. Tests never reach a real database.
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: file:./ci-test.db

  lockfile:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # --ignore-scripts: a dependency's lifecycle scripts must not run in the
      # job whose only purpose is to prove the lockfile is complete. `npm ci`
      # itself fails when package.json and the lock divergence.
      - name: Install frontend strictly from the lockfile
        run: npm ci --ignore-scripts

      - name: Frontend lockfile must not change
        run: git diff --exit-code -- package-lock.json

      - name: Install backend strictly from the lockfile
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: Backend lockfile must not change
        run: git diff --exit-code -- backend/package-lock.json

  npm-audit:
    name: Dependency audit (high and above)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend
