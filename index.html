<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E3D33" />
    <meta
      name="description"
      content="PathYatra is a Nepal-first travel companion. Discover destinations, plan within your budget, understand seasons and routes, and carry your itinerary with you."
    />
    <title>PathYatra — Your Journey. Your Budget. Your Nepal.</title>
    <!--
      Defence in depth for a static SPA. Vite relaxes script-src for the dev
      server only (see the devCsp plugin in vite.config.ts); this shipped tag is
      what production browsers enforce. `frame-ancestors` is inert in a meta tag
      and only documents intent — it must be sent as an HTTP header to work.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://res.cloudinary.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.open-meteo.com https://*.ingest.sentry.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
